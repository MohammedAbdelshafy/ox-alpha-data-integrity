[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ox-alpha-data-integrity"
version = "0.1.0"
description = "Check CSV, JSON and JSONL files for missing fields, inconsistent types, duplicate rows and changes between snapshots."
authors = [{name = "Mohammed Abdelshafy"}]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
ox-alpha = "ox_alpha.cli:main"

[tool.setuptools.packages.find]
include = ["ox_alpha*"]
