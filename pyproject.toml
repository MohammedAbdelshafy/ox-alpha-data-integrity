[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ox-alpha-data-integrity"
version = "0.1.0"
description = "CLI that audits CSV/JSON datasets: schema inference, validation, anomaly and duplicate detection, drift checks, quality reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
ox-alpha = "ox_alpha.cli:main"

[tool.setuptools.packages.find]
include = ["ox_alpha*"]
