[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ox-alpha-data-integrity"
version = "0.1.0"
description = "Data-quality checks for CSV, JSON and JSONL files, including missing required fields, type issues, exact duplicates, outliers and changes between snapshots."
authors = [{name = "Mohammed Abdelshafy"}]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
ox-alpha = "ox_alpha.cli:main"

[tool.setuptools.packages.find]
include = ["ox_alpha*"]
