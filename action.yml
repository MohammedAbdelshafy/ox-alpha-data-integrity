name: 'OX-Alpha Data Quality Checks'
description: 'Check a CSV/JSON/JSONL dataset in CI, report data-quality findings, and fail the workflow at your chosen severity.'
author: 'Mohammed Abdelshafy'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  path:
    description: 'Dataset file to check (CSV, JSON or JSONL), relative to your repo root'
    required: true
  required:
    description: 'Comma-separated list of required columns'
    required: false
    default: ''
  fail-on:
    description: 'Minimum severity that fails the run: info, warning, or error'
    required: false
    default: 'error'
  out-dir:
    description: 'Directory for the audit report'
    required: false
    default: './ox-alpha-report'
runs:
  using: 'composite'
  steps:
    - name: Checkout OX-Alpha Data Quality Checks
      uses: actions/checkout@v4
      with:
        repository: MohammedAbdelshafy/ox-alpha-data-integrity
        path: _ox_alpha
    - name: Run OX-Alpha data-quality checks
      shell: bash
      run: |
        cd _ox_alpha
        args="${{ github.workspace }}/${{ inputs.path }}"
        if [ -n "${{ inputs.required }}" ]; then args="$args --required ${{ inputs.required }}"; fi
        python3 -m ox_alpha audit $args --fail-on "${{ inputs.fail-on }}" --out-dir "${{ github.workspace }}/${{ inputs.out-dir }}"
